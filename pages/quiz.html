<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>顏面部穴位學習測驗</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%;
    background: #e5e5e3;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; width: 100vw; min-height: 100vh; }

  #titleBar {
    position: relative; flex: 0 0 auto;
    background: #e5e5e3;
    padding: env(safe-area-inset-top, 10px) 12px 8px;
    text-align: center;
    border-bottom: 1px solid #d0d0cd;
  }
  #titleBar .backLink {
    position: absolute; left: 12px; top: env(safe-area-inset-top, 10px);
    color: #888; font-size: 12px; text-decoration: none;
  }
  #titleBar h1 {
    margin: 0;
    color: #D97757;
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", "STSong", serif;
    font-weight: 700; font-size: 18px; letter-spacing: 1px;
  }

  #modeTabs {
    flex: 0 0 auto; display: flex; background: #e5e5e3;
    border-bottom: 1px solid #d0d0cd;
  }
  #modeTabs button {
    flex: 1; padding: 12px 6px; border: none; background: transparent;
    color: #888; font-size: 13.5px; font-weight: 600;
    border-bottom: 3px solid transparent;
  }
  #modeTabs button.active { color: #D97757; border-bottom-color: #D97757; }

  .mode-panel { display: none; flex: 1; flex-direction: column; }
  .mode-panel.active { display: flex; }

  /* ---------- 學員姓名欄位 ---------- */
  .name-field { margin-bottom: 16px; }
  .name-field label { display: block; font-size: 12.5px; color: #777; font-weight: 700; margin-bottom: 8px; }
  .name-field input {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px;
    border: 1px solid #ddd; font-size: 14px; color: #222; background: #fff;
  }

  /* ---------- 題庫選題測試 ---------- */
  #quizSetup { padding: 18px 16px; }
  #quizSetup .row { margin-bottom: 16px; }
  #quizSetup label.rowLabel { display: block; font-size: 12.5px; color: #777; font-weight: 700; margin-bottom: 8px; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border-radius: 16px; background: #fff; border: 1px solid #ddd;
    font-size: 12.5px; color: #555;
  }
  .chip.active { background: #D97757; color: #fff; border-color: #D97757; }
  #startQuizBtn {
    width: 100%; padding: 14px; margin-top: 6px; border: none; border-radius: 10px;
    background: #D97757; color: #fff; font-size: 15px; font-weight: 700;
  }
  #quizProgress {
    padding: 10px 16px; font-size: 12px; color: #888; display: flex; justify-content: space-between;
    border-bottom: 1px solid #d8d8d5;
  }
  #quizBody { flex: 1; padding: 20px 16px; }
  #qText { font-size: 16px; font-weight: 700; color: #222; line-height: 1.7; margin-bottom: 18px; }
  #qOptions { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    text-align: left; padding: 13px 14px; border-radius: 10px; border: 1px solid #ddd;
    background: #fff; font-size: 14px; color: #333; line-height: 1.5;
  }
  .opt-btn.correct { background: #e4f7e9; border-color: #2ecc71; color: #1a7a3d; }
  .opt-btn.wrong { background: #fdecea; border-color: #e74c3c; color: #b23; }
  #qFeedback { margin-top: 14px; font-size: 12.5px; color: #666; line-height: 1.8; background: #f2f2f0; border-radius: 10px; padding: 10px 12px; display: none; }
  #qNextBtn {
    margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: #3d7ab0; color: #fff; font-size: 14px; font-weight: 700; display: none;
  }
  #quizResult { padding: 40px 20px; text-align: center; }
  #quizResult .score { font-size: 42px; font-weight: 800; color: #D97757; margin-bottom: 6px; }
  #quizResult .scoreLabel { font-size: 13px; color: #888; margin-bottom: 24px; }
  #quizResult button {
    padding: 12px 24px; border: none; border-radius: 10px; background: #D97757; color: #fff;
    font-size: 14px; font-weight: 700;
  }

  /* ---------- AR跑考 ---------- */
  #arQuizWrap { position: relative; flex: 0 0 auto; height: 58vh; background: #000; overflow: hidden; }
  #arqVideo, #arqOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #arqVideo { transform: scaleX(-1); }
  #arqOverlay { pointer-events: none; }
  #arqStatus {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #eee; font-size: 13px; text-align: center; z-index: 10;
    background: rgba(0,0,0,.5); padding: 12px 18px; border-radius: 12px; max-width: 80%;
  }
  #arqTopbar {
    position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent); z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
  }
  #arqTopbar .score { color: #fff; font-size: 12px; background: rgba(255,255,255,.18); padding: 6px 12px; border-radius: 14px; }
  #arqTopbar button { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 20px; padding: 7px 12px; font-size: 12px; }

  #arqPanel { flex: 1; padding: 16px; display: flex; flex-direction: column; }
  #arqStart { text-align: center; padding: 30px 16px; }
  #arqStart p { color: #666; font-size: 12.5px; line-height: 1.9; margin-bottom: 20px; }
  #arqStartBtn {
    padding: 14px 32px; border: none; border-radius: 10px; background: #D97757; color: #fff;
    font-size: 15px; font-weight: 700;
  }
  #arqQuestion { text-align: center; }
  #arqQuestion .targetName { font-size: 22px; font-weight: 800; color: #D97757; margin-bottom: 4px; }
  #arqQuestion .targetCode { font-size: 12px; color: #999; margin-bottom: 14px; }
  #arqQuestion .hint { font-size: 12px; color: #777; line-height: 1.8; margin-bottom: 16px; }
  #arqTapHint { font-size: 12px; color: #3d7ab0; font-weight: 600; }
  #arqIdentifyQuestion { text-align: center; display: none; }
  #arqIdentifyQuestion .prompt { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 14px; }
  #arqIdentifyOptions { display: flex; flex-direction: column; gap: 10px; }
  #arqFeedback { display: none; text-align: center; }
  #arqFeedback .verdict { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  #arqFeedback .verdict.good { color: #2ecc71; }
  #arqFeedback .verdict.mid { color: #e6a23c; }
  #arqFeedback .verdict.bad { color: #e74c3c; }
  #arqFeedback .ans { font-size: 12px; color: #777; margin-bottom: 16px; line-height: 1.8; }
  #arqNextBtn {
    padding: 12px 28px; border: none; border-radius: 10px; background: #3d7ab0; color: #fff;
    font-size: 14px; font-weight: 700;
  }
  .marker { position: absolute; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%,-50%); border: 2px solid #fff; z-index: 8; }
  .marker.tap { background: rgba(61,122,176,.85); }
  .marker.truth { background: rgba(46,204,113,.85); }
</style>
</head>
<body>

<div id="app">
  <div id="titleBar">
    <a class="backLink" href="../index.html">← 首頁</a>
    <h1>顏面部穴位學習測驗</h1>
  </div>

  <div id="modeTabs">
    <button id="tabAR" class="active">AR跑考</button>
    <button id="tabQuiz">題庫選題測試</button>
  </div>

  <!-- ===================== AR跑考 ===================== -->
  <div id="panelAR" class="mode-panel active">
    <div id="arQuizWrap">
      <video id="arqVideo" playsinline muted autoplay></video>
      <canvas id="arqOverlay"></canvas>
      <div id="arqTopbar">
        <span class="score" id="arqScoreDisplay">0 / 0</span>
        <button id="arqStopBtn" style="display:none;">結束測驗</button>
      </div>
      <div id="arqStatus">尚未開始</div>
    </div>
    <div id="arqPanel">
      <div id="arqStart">
        <div class="name-field">
          <label for="arqStudentName">學員姓名</label>
          <input type="text" id="arqStudentName" placeholder="請輸入姓名">
        </div>
        <p>AR跑考會隨機出題，共兩種題型：(1)依系統顯示的穴位名稱，用手指在下方相機畫面中點出該穴位所在位置；(2)畫面中會標示出某一穴位／肌肉／神經／血管，請於下方選項選出正確名稱。作答前不會顯示穴位位置，回答後才會顯示正解。建議正臉面對鏡頭、光線充足。</p>
        <button id="arqStartBtn">開始跑考（10題）</button>
      </div>
      <div id="arqQuestion" style="display:none;">
        <div class="targetName" id="arqName"></div>
        <div class="targetCode" id="arqCode"></div>
        <div id="arqTapHint">👆 請在上方相機畫面點出此穴位位置</div>
      </div>
      <div id="arqIdentifyQuestion">
        <div class="prompt">請觀察上方相機畫面中標示的構造，選出正確名稱</div>
        <div id="arqIdentifyOptions"></div>
      </div>
      <div id="arqFeedback">
        <div class="verdict" id="arqVerdict"></div>
        <div class="ans" id="arqAnsText"></div>
        <button id="arqNextBtn">下一題</button>
      </div>
    </div>
  </div>

  <!-- ===================== 題庫選題測試 ===================== -->
  <div id="panelQuiz" class="mode-panel">
    <div id="quizSetup">
      <div class="name-field">
        <label for="quizStudentName">學員姓名</label>
        <input type="text" id="quizStudentName" placeholder="請輸入姓名">
      </div>
      <div class="row">
        <label class="rowLabel">選擇經絡範圍</label>
        <div class="chip-group" id="meridianChips"></div>
      </div>
      <div class="row">
        <label class="rowLabel">題目類型</label>
        <div class="chip-group" id="typeChips">
          <div class="chip active" data-type="all">綜合</div>
          <div class="chip" data-type="code">經絡歸經</div>
          <div class="chip" data-type="loc">取穴位置</div>
          <div class="chip" data-type="ind">主治功效</div>
        </div>
      </div>
      <p style="font-size:11.5px;color:#999;margin:0 0 16px;">預設從所選範圍題目中抽15題進行測驗。</p>
      <button id="startQuizBtn">開始測驗</button>
    </div>

    <div id="quizRunning" style="display:none; flex-direction:column; flex:1;">
      <div id="quizProgress"><span id="qIndexLabel">第 1 / 15 題</span><span id="qScoreLabel">答對 0 題</span></div>
      <div id="quizBody">
        <div id="qText"></div>
        <div id="qOptions"></div>
        <div id="qFeedback"></div>
        <button id="qNextBtn">下一題</button>
      </div>
    </div>

    <div id="quizResult" style="display:none;">
      <div class="score" id="resultScore">0%</div>
      <div class="scoreLabel" id="resultLabel">答對 0 / 0 題</div>
      <button id="retryQuizBtn">重新測驗</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.5/dist/face-landmarks-detection.min.js"></script>
<script src="../assets/acupoints-geo.js"></script>
<script>
/* ==================================================================
   顏面部穴位學習測驗 — AR跑考 + 題庫選題測試
   共用資料來源：../assets/acupoints-geo.js（IDX / ACUPOINTS / MERIDIANS）
================================================================== */

/* ---------------- 成績記錄至 Google Sheet ----------------
   請先部署一個 Google Apps Script Web App（Deploy as Web App，權限設為 Anyone），
   並將其網址填入下方 SHEET_WEBHOOK_URL。Apps Script 端範例：

   function doPost(e) {
     const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
     const data = JSON.parse(e.postData.contents);
     sheet.appendRow([new Date(), data.name, data.mode, data.score, data.total, data.timeText]);
     return ContentService.createTextOutput('ok');
   }
------------------------------------------------------------- */
const SHEET_WEBHOOK_URL = 'https://script.google.com/a/macros/h.tmu.edu.tw/s/AKfycbylkWdePAjjQSeKQoXW6w7CXWd6cKzxJlkyY-FS3uYv9x_yA4iU1g45nYrUsP9QpFQ/exec';

function formatElapsed(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return `${m}分${s.toString().padStart(2,'0')}秒`;
}

function submitResultToSheet({ name, mode, score, total, elapsedSec }) {
  if (!SHEET_WEBHOOK_URL) return; // 尚未設定Google Sheet網址時略過
  const payload = { name, mode, score, total, timeText: formatElapsed(elapsedSec) };
  fetch(SHEET_WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

/* ---------------- Tab 切換 ---------------- */
const tabAR = document.getElementById('tabAR');
const tabQuiz = document.getElementById('tabQuiz');
const panelAR = document.getElementById('panelAR');
const panelQuiz = document.getElementById('panelQuiz');

tabAR.addEventListener('click', () => switchTab('ar'));
tabQuiz.addEventListener('click', () => switchTab('quiz'));

function switchTab(mode) {
  tabAR.classList.toggle('active', mode === 'ar');
  tabQuiz.classList.toggle('active', mode === 'quiz');
  panelAR.classList.toggle('active', mode === 'ar');
  panelQuiz.classList.toggle('active', mode === 'quiz');
  if (mode !== 'ar') stopArQuizCamera();
}

/* ==================================================================
   題庫選題測試
================================================================== */
const meridianChipsEl = document.getElementById('meridianChips');
const typeChipsEl = document.getElementById('typeChips');
const quizStudentName = document.getElementById('quizStudentName');
const startQuizBtn = document.getElementById('startQuizBtn');
const quizSetup = document.getElementById('quizSetup');
const quizRunning = document.getElementById('quizRunning');
const quizResult = document.getElementById('quizResult');
const qIndexLabel = document.getElementById('qIndexLabel');
const qScoreLabel = document.getElementById('qScoreLabel');
const qText = document.getElementById('qText');
const qOptions = document.getElementById('qOptions');
const qFeedback = document.getElementById('qFeedback');
const qNextBtn = document.getElementById('qNextBtn');

MERIDIAN_ORDER.forEach(code => {
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.dataset.meridian = code;
  chip.textContent = MERIDIANS[code].name;
  meridianChipsEl.appendChild(chip);
});
meridianChipsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) c.classList.toggle('active');
});
typeChipsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  typeChipsEl.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
});

const QUIZ_QUESTION_COUNT = 15;
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizStartTime = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }

function buildQuestion(point, type, pool) {
  const others = pool.filter(p => p.id !== point.id);
  if (type === 'code') {
    const correct = MERIDIANS[point.meridian].name;
    const wrongPool = shuffle([...new Set(others.map(p => MERIDIANS[p.meridian].name))].filter(n => n !== correct));
    const opts = shuffle([correct, ...wrongPool.slice(0, 3)]);
    return { text: `「${point.name}（${point.code}）」屬於哪一經絡？`, opts, answer: correct,
      explain: `${point.name}：${point.desc}` };
  }
  if (type === 'loc') {
    const correct = point.desc;
    const wrongPool = shuffle(others.map(p => p.desc));
    const opts = shuffle([correct, ...wrongPool.slice(0, 3)]);
    return { text: `「${point.name}（${point.code}）」的取穴位置為何？`, opts, answer: correct,
      explain: `主治：${point.indications}` };
  }
  if (type === 'ind') {
    const correct = point.indications;
    const wrongPool = shuffle(others.map(p => p.indications));
    const opts = shuffle([correct, ...wrongPool.slice(0, 3)]);
    return { text: `「${point.name}（${point.code}）」的主治功效為何？`, opts, answer: correct,
      explain: `取穴：${point.desc}` };
  }
  // all: 隨機挑一種
  return buildQuestion(point, sample(['code','loc','ind'], 1)[0], pool);
}

startQuizBtn.addEventListener('click', () => {
  if (!quizStudentName.value.trim()) {
    alert('請先輸入學員姓名');
    quizStudentName.focus();
    return;
  }
  const selectedMeridians = [...meridianChipsEl.querySelectorAll('.chip.active')].map(c => c.dataset.meridian);
  const type = typeChipsEl.querySelector('.chip.active').dataset.type;

  const pool = ACUPOINTS.filter(p => selectedMeridians.includes(p.meridian));
  if (pool.length < 4) {
    alert('選擇的經絡範圍題目數不足，請至少選擇涵蓋較多穴位的經絡。');
    return;
  }
  const chosen = sample(pool, Math.min(QUIZ_QUESTION_COUNT, pool.length));
  quizQuestions = chosen.map(p => buildQuestion(p, type, pool));
  quizIndex = 0; quizScore = 0;
  quizStartTime = Date.now();

  quizSetup.style.display = 'none';
  quizResult.style.display = 'none';
  quizRunning.style.display = 'flex';
  renderQuestion();
});

function renderQuestion() {
  qFeedback.style.display = 'none';
  qNextBtn.style.display = 'none';
  const q = quizQuestions[quizIndex];
  qIndexLabel.textContent = `第 ${quizIndex + 1} / ${quizQuestions.length} 題`;
  qScoreLabel.textContent = `答對 ${quizScore} 題`;
  qText.textContent = q.text;
  qOptions.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => answerQuestion(btn, opt, q));
    qOptions.appendChild(btn);
  });
}

function answerQuestion(btn, chosen, q) {
  qOptions.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  if (chosen !== q.answer) btn.classList.add('wrong');
  else quizScore++;

  qFeedback.style.display = 'block';
  qFeedback.textContent = (chosen === q.answer ? '✔ 答對了！' : '✘ 答錯了，正解如上。') + '　' + q.explain;
  qNextBtn.style.display = 'block';
  qNextBtn.textContent = quizIndex + 1 < quizQuestions.length ? '下一題' : '看結果';
}

qNextBtn.addEventListener('click', () => {
  quizIndex++;
  if (quizIndex >= quizQuestions.length) {
    quizRunning.style.display = 'none';
    quizResult.style.display = 'block';
    const pct = Math.round((quizScore / quizQuestions.length) * 100);
    document.getElementById('resultScore').textContent = pct + '%';
    document.getElementById('resultLabel').textContent = `答對 ${quizScore} / ${quizQuestions.length} 題`;
    const elapsedSec = (Date.now() - quizStartTime) / 1000;
    submitResultToSheet({
      name: quizStudentName.value.trim(), mode: '題庫選題測試',
      score: quizScore, total: quizQuestions.length, elapsedSec
    });
  } else {
    renderQuestion();
  }
});

document.getElementById('retryQuizBtn').addEventListener('click', () => {
  quizResult.style.display = 'none';
  quizSetup.style.display = 'block';
});

/* ==================================================================
   AR跑考
================================================================== */
const arqVideo = document.getElementById('arqVideo');
const arqOverlay = document.getElementById('arqOverlay');
const arqCtx = arqOverlay.getContext('2d');
const arqStatus = document.getElementById('arqStatus');
const arqStartBtn = document.getElementById('arqStartBtn');
const arqStopBtn = document.getElementById('arqStopBtn');
const arqStart = document.getElementById('arqStart');
const arqStudentName = document.getElementById('arqStudentName');
const arqQuestion = document.getElementById('arqQuestion');
const arqIdentifyQuestion = document.getElementById('arqIdentifyQuestion');
const arqIdentifyOptions = document.getElementById('arqIdentifyOptions');
const arqFeedback = document.getElementById('arqFeedback');
const arqName = document.getElementById('arqName');
const arqCode = document.getElementById('arqCode');
const arqVerdict = document.getElementById('arqVerdict');
const arqAnsText = document.getElementById('arqAnsText');
const arqNextBtn = document.getElementById('arqNextBtn');
const arqScoreDisplay = document.getElementById('arqScoreDisplay');

let arqDetector = null;
let arqRunning = false;
let arqLoopId = null;
let arqLatestKp = null;
let arqQueue = [];
let arqQIdx = 0;
let arqCorrectCount = 0;
let arqAwaitingTap = false;
let arqAwaitingIdentify = false;
let arqCurrentPoint = null;
let arqCurrentSide = null;
let arqCurrentIdentify = null;
let arqStartTime = 0;

function arqResize() {
  arqOverlay.width = arqOverlay.clientWidth;
  arqOverlay.height = arqOverlay.clientHeight;
}
function arqMapping() {
  const vw = arqVideo.videoWidth, vh = arqVideo.videoHeight;
  const cw = arqOverlay.width, ch = arqOverlay.height;
  const scale = Math.max(cw / vw, ch / vh);
  return { scale, offsetX: (cw - vw * scale) / 2, offsetY: (ch - vh * scale) / 2 };
}
function arqToCanvas(pos, m) {
  const rawX = pos.x * m.scale + m.offsetX;
  const rawY = pos.y * m.scale + m.offsetY;
  return { x: arqOverlay.width - rawX, y: rawY }; // 鏡像（前鏡頭）
}
function arqToCanvasPts(pts, m) { return pts.map(p => arqToCanvas(p, m)); }
function arqFaceScale(kp) {
  return dist(kp[IDX.templeR], kp[IDX.templeL]);
}

/* ---------------- 題型2（指認題）題庫：穴位／肌肉／神經／血管 ---------------- */
function buildIdentifyPool() {
  const pool = [];
  ACUPOINTS.filter(p => typeof p.calc === 'function').forEach(p => {
    pool.push({ type: 'acupoint', name: p.name, side: p.side, ref: p });
  });
  MUSCLES.forEach(m => {
    pool.push({ type: 'muscle', name: m.zh, side: m.side, ref: m });
  });
  VESSELS.forEach(v => {
    pool.push({ type: 'vessel', name: v.zh, side: v.side, ref: v });
  });
  [
    { id: 'v1', name: '三叉神經眼神經(V1)' },
    { id: 'v2', name: '三叉神經上頷神經(V2)' },
    { id: 'v3', name: '三叉神經下頷神經(V3)' }
  ].forEach(b => pool.push({ type: 'nerve', subtype: 'trigeminal', branchId: b.id, name: b.name, side: 'LR' }));
  [
    { id: 'temporal_a', name: '顏面神經顳支' },
    { id: 'zygomatic', name: '顏面神經顴支' },
    { id: 'buccal_a', name: '顏面神經頰支' },
    { id: 'mandibular', name: '顏面神經下頷緣支' },
    { id: 'cervical', name: '顏面神經頸支' }
  ].forEach(b => pool.push({ type: 'nerve', subtype: 'facial', branchId: b.id, name: b.name, side: 'LR' }));
  return pool;
}
const IDENTIFY_POOL = buildIdentifyPool();

function identifyItemPts(it, kp, side, scale) {
  if (it.type === 'acupoint') {
    const pos = it.ref.calc(kp, it.ref.side === 'M' ? null : side, scale);
    return [pos];
  }
  if (it.type === 'muscle') {
    return it.ref.side === 'M' ? it.ref.calc(kp, scale) : it.ref.calc(kp, side, scale);
  }
  if (it.type === 'vessel') {
    return it.ref.calc(kp, side, scale);
  }
  if (it.type === 'nerve') {
    if (it.subtype === 'trigeminal') {
      const br = trigeminalPaths(kp, side, scale).branches.find(b => b.id === it.branchId);
      return br ? br.pts : [];
    }
    const br = facialNervePaths(kp, side, scale).branches.find(b => b.id === it.branchId);
    return br ? br.pts : [];
  }
  return [];
}

function drawIdentifyHighlight() {
  if (!arqAwaitingIdentify || !arqLatestKp || !arqCurrentIdentify) return;
  const m = arqMapping();
  const scale = arqFaceScale(arqLatestKp);
  const pts = identifyItemPts(arqCurrentIdentify.item, arqLatestKp, arqCurrentIdentify.side, scale);
  if (!pts.length) return;
  const canvasPts = arqToCanvasPts(pts, m);
  arqCtx.save();
  if (canvasPts.length === 1) {
    const t = Date.now() / 300;
    const pulse = 9 + Math.sin(t) * 3;
    arqCtx.beginPath();
    arqCtx.arc(canvasPts[0].x, canvasPts[0].y, pulse, 0, Math.PI * 2);
    arqCtx.fillStyle = 'rgba(255,193,7,.35)';
    arqCtx.fill();
    arqCtx.lineWidth = 2.5;
    arqCtx.strokeStyle = '#ffc107';
    arqCtx.stroke();
  } else if (arqCurrentIdentify.item.type === 'muscle') {
    arqCtx.beginPath();
    canvasPts.forEach((p, i) => { if (i === 0) arqCtx.moveTo(p.x, p.y); else arqCtx.lineTo(p.x, p.y); });
    arqCtx.closePath();
    arqCtx.fillStyle = 'rgba(255,193,7,.3)';
    arqCtx.fill();
    arqCtx.lineWidth = 2.5;
    arqCtx.strokeStyle = '#ffc107';
    arqCtx.stroke();
  } else {
    arqCtx.beginPath();
    canvasPts.forEach((p, i) => { if (i === 0) arqCtx.moveTo(p.x, p.y); else arqCtx.lineTo(p.x, p.y); });
    arqCtx.lineWidth = 3.5;
    arqCtx.strokeStyle = '#ffc107';
    arqCtx.lineCap = 'round';
    arqCtx.stroke();
  }
  arqCtx.restore();
}

async function arqSetupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  arqVideo.srcObject = stream;
  return new Promise(res => { arqVideo.onloadedmetadata = () => res(); });
}
async function arqLoadModel() {
  if (arqDetector) return;
  const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
  arqDetector = await faceLandmarksDetection.createDetector(model, {
    runtime: 'mediapipe',
    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619',
    refineLandmarks: false, maxFaces: 1
  });
}

async function arqDetectLoop() {
  if (!arqRunning) return;
  if (arqDetector && arqVideo.readyState >= 2) {
    const faces = await arqDetector.estimateFaces(arqVideo);
    arqCtx.clearRect(0, 0, arqOverlay.width, arqOverlay.height);
    if (faces.length > 0) {
      arqLatestKp = faces[0].keypoints;
      arqStatus.style.display = 'none';
      drawIdentifyHighlight();
    } else {
      arqLatestKp = null;
      arqStatus.style.display = 'block';
      arqStatus.textContent = '請將臉部正對鏡頭';
    }
  }
  arqLoopId = requestAnimationFrame(arqDetectLoop);
}

function buildArqQueue(n) {
  const eligible = ACUPOINTS.filter(p => typeof p.calc === 'function');
  const list = [];
  for (let i = 0; i < n; i++) {
    if (Math.random() < 0.5) {
      const p = sample(eligible, 1)[0];
      list.push({ qtype: 'tap', point: p, side: p.side === 'LR' ? (Math.random() < 0.5 ? 'R' : 'L') : 'M' });
    } else {
      const it = sample(IDENTIFY_POOL, 1)[0];
      list.push({ qtype: 'identify', item: it, side: it.side === 'LR' ? (Math.random() < 0.5 ? 'R' : 'L') : 'M' });
    }
  }
  return list;
}

arqStartBtn.addEventListener('click', async () => {
  if (!arqStudentName.value.trim()) {
    alert('請先輸入學員姓名');
    arqStudentName.focus();
    return;
  }
  arqStatus.style.display = 'block';
  arqStatus.textContent = '正在啟動相機…';
  try {
    await arqSetupCamera();
    arqResize();
    arqStatus.textContent = '正在載入辨識模型…';
    await arqLoadModel();
    arqRunning = true;
    arqDetectLoop();
    arqStatus.textContent = '請將臉部正對鏡頭';

    arqQueue = buildArqQueue(10);
    arqQIdx = 0; arqCorrectCount = 0;
    arqStartTime = Date.now();
    arqScoreDisplay.textContent = `0 / ${arqQueue.length}`;
    arqStart.style.display = 'none';
    arqStopBtn.style.display = 'block';
    nextArqQuestion();
  } catch (err) {
    arqStatus.textContent = '啟動失敗：' + err.message + '（請確認已允許相機權限，且網頁為 HTTPS）';
  }
});

function nextArqQuestion() {
  if (arqQIdx >= arqQueue.length) { finishArqQuiz(); return; }
  const q = arqQueue[arqQIdx];
  arqFeedback.style.display = 'none';
  if (q.qtype === 'tap') {
    arqAwaitingIdentify = false;
    arqCurrentPoint = q.point;
    arqCurrentSide = q.side;
    arqName.textContent = q.point.name + (q.side === 'R' ? '（右側）' : q.side === 'L' ? '（左側）' : '');
    arqCode.textContent = q.point.code;
    arqQuestion.style.display = 'block';
    arqIdentifyQuestion.style.display = 'none';
    arqAwaitingTap = true;
  } else {
    arqAwaitingTap = false;
    arqCurrentIdentify = { item: q.item, side: q.side };
    const distractPool = IDENTIFY_POOL.filter(x => x.name !== q.item.name);
    const wrongNames = [...new Set(shuffle(distractPool).map(x => x.name))].slice(0, 3);
    const opts = shuffle([q.item.name, ...wrongNames]);
    arqIdentifyOptions.innerHTML = '';
    opts.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = name;
      btn.addEventListener('click', () => handleIdentifyAnswer(btn, name, q.item.name));
      arqIdentifyOptions.appendChild(btn);
    });
    arqQuestion.style.display = 'none';
    arqIdentifyQuestion.style.display = 'block';
    arqAwaitingIdentify = true;
  }
}

function handleIdentifyAnswer(btn, chosen, correctName) {
  if (!arqAwaitingIdentify) return;
  arqAwaitingIdentify = false;
  arqIdentifyOptions.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctName) b.classList.add('correct');
  });
  if (chosen !== correctName) { btn.classList.add('wrong'); }
  else { arqCorrectCount++; }

  arqVerdict.textContent = chosen === correctName ? '✔ 正確！' : '✘ 答錯了';
  arqVerdict.className = 'verdict ' + (chosen === correctName ? 'good' : 'bad');
  arqAnsText.textContent = `正解：${correctName}`;
  arqIdentifyQuestion.style.display = 'none';
  arqFeedback.style.display = 'block';
  arqScoreDisplay.textContent = `${arqCorrectCount} / ${arqQueue.length}`;
}

arqOverlay.addEventListener('click', handleArqTap);
arqVideo.addEventListener('click', handleArqTap);

function handleArqTap(evt) {
  if (!arqAwaitingTap || !arqLatestKp) return;
  const rect = arqOverlay.getBoundingClientRect();
  const tapX = evt.clientX - rect.left;
  const tapY = evt.clientY - rect.top;

  const m = arqMapping();
  const scForCalc = arqFaceScale(arqLatestKp);
  const truePos = arqCurrentPoint.calc(arqLatestKp, arqCurrentSide, scForCalc);
  const trueCanvas = arqToCanvas(truePos, m);

  const faceWidthPx = arqToCanvas(arqLatestKp[IDX.templeL], m).x - arqToCanvas(arqLatestKp[IDX.templeR], m).x;
  const normFactor = Math.abs(faceWidthPx) || 1;
  const pxDist = Math.hypot(tapX - trueCanvas.x, tapY - trueCanvas.y);
  const relDist = pxDist / normFactor;

  arqAwaitingTap = false;

  // 畫出使用者點擊位置與正解位置
  drawMarker(tapX, tapY, 'tap');
  drawMarker(trueCanvas.x, trueCanvas.y, 'truth');

  let verdict, verdictClass;
  if (relDist < 0.045) { verdict = '✔ 正確！'; verdictClass = 'good'; arqCorrectCount++; }
  else if (relDist < 0.09) { verdict = '△ 大致正確（略有偏移）'; verdictClass = 'mid'; arqCorrectCount += 0.5; }
  else { verdict = '✘ 位置偏離較大'; verdictClass = 'bad'; }

  arqVerdict.textContent = verdict;
  arqVerdict.className = 'verdict ' + verdictClass;
  arqAnsText.textContent = `${arqCurrentPoint.name}：${arqCurrentPoint.desc}`;
  arqQuestion.style.display = 'none';
  arqFeedback.style.display = 'block';
  arqScoreDisplay.textContent = `${arqCorrectCount} / ${arqQueue.length}`;
}

function drawMarker(x, y, kind) {
  const el = document.createElement('div');
  el.className = 'marker ' + kind;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.getElementById('arQuizWrap').appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

arqNextBtn.addEventListener('click', () => {
  arqQIdx++;
  nextArqQuestion();
});

function finishArqQuiz() {
  arqQuestion.style.display = 'none';
  arqIdentifyQuestion.style.display = 'none';
  arqFeedback.style.display = 'none';
  const elapsedSec = (Date.now() - arqStartTime) / 1000;
  submitResultToSheet({
    name: arqStudentName.value.trim(), mode: 'AR跑考',
    score: arqCorrectCount, total: arqQueue.length, elapsedSec
  });
  arqStart.style.display = 'block';
  arqStart.innerHTML = `<p style="font-size:16px;font-weight:700;color:#D97757;">測驗結束！得分 ${arqCorrectCount} / ${arqQueue.length}</p>
    <p>可重新開始測驗，系統將重新隨機出題。</p>`;
  const btn = document.createElement('button');
  btn.id = 'arqStartBtn';
  btn.textContent = '再測一次（10題）';
  arqStart.appendChild(btn);
  btn.addEventListener('click', () => arqStartBtn.click());
  arqStopBtn.style.display = 'none';
}

function stopArQuizCamera() {
  arqRunning = false;
  if (arqLoopId) cancelAnimationFrame(arqLoopId);
  if (arqVideo.srcObject) {
    arqVideo.srcObject.getTracks().forEach(t => t.stop());
    arqVideo.srcObject = null;
  }
}

arqStopBtn.addEventListener('click', () => {
  stopArQuizCamera();
  arqQuestion.style.display = 'none';
  arqFeedback.style.display = 'none';
  arqStart.style.display = 'block';
  arqStopBtn.style.display = 'none';
  arqStatus.style.display = 'block';
  arqStatus.textContent = '尚未開始';
});

window.addEventListener('resize', arqResize);
</script>
