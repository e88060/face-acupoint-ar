<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>顏面部穴位AR學習</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #e5e5e3; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

  #titleBar {
    flex: 0 0 auto;
    background: #e5e5e3;
    padding: env(safe-area-inset-top, 10px) 12px 8px;
    text-align: center;
    border-bottom: 1px solid #d0d0cd;
  }
  #titleBar h1 {
    margin: 0;
    color: #D97757;
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", "STSong", serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 1px;
  }

  #arControlBar {
    flex: 0 0 auto;
    background: #e5e5e3;
    padding: 8px 12px;
    display: flex; justify-content: center;
    border-bottom: 1px solid #d0d0cd;
  }
  .ar-toggle {
    padding: 8px 20px; border-radius: 20px; border: none;
    font-size: 13px; font-weight: 600;
  }
  .ar-toggle.on { background: #D97757; color: #fff; }
  .ar-toggle.off { background: #bfbfbc; color: #444; }

  #arWrap { position: relative; flex: 1 1 42%; min-height: 0; background: #000; overflow: hidden; }
  #arWrap.collapsed { display: none; }
  #video, #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #video { transform: scaleX(-1); }
  #overlay { pointer-events: none; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 8px 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
    z-index: 10;
    gap: 6px;
  }
  #topbar button {
    background: rgba(255,255,255,.18); color: #fff; border: none;
    border-radius: 20px; padding: 7px 12px; font-size: 12px;
  }
  #topbar button.active { background: rgba(52,152,219,.85); }

  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #eee; font-size: 13px; text-align: center; z-index: 10;
    background: rgba(0,0,0,.5); padding: 12px 18px; border-radius: 12px;
    max-width: 80%;
  }

  .dot-label {
    position: absolute; transform: translate(-50%, -100%);
    color: #fff; font-size: 10px; text-align: center; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); z-index: 9; line-height: 1.3;
  }
  .dot-label .lbl-name { font-weight: 600; }
  .dot-label .lbl-desc {
    display: block; font-weight: 400; font-size: 9px; color: #ffe;
    white-space: normal; max-width: 120px; margin-top: 1px;
  }

  #panel {
    flex: 1 1 58%; min-height: 0; overflow-y: auto;
    background: #e5e5e3; padding: 14px 12px calc(env(safe-area-inset-bottom,10px) + 120px);
    -webkit-overflow-scrolling: touch;
  }
  #noteToolbar {
    display: flex; gap: 8px; padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px solid #cfcfcc;
  }
  #noteToolbar button {
    flex: 1; background: #d8d8d5; color: #333; border: none;
    border-radius: 8px; padding: 10px 8px; font-size: 12px; font-weight: 600;
  }
  #noteToolbar button.save { background: #D97757; color: #fff; }
  #panelNote {
    color: #666; font-size: 11px; line-height: 1.6; padding: 4px 2px 16px;
    border-bottom: 1px solid #cfcfcc; margin-bottom: 14px;
  }
  .mer-section { margin-bottom: 14px; }
  .mer-header {
    display: flex; align-items: center; justify-content: space-between;
    border-left: 4px solid #999; padding: 6px 8px; margin-bottom: 6px;
    background: #d8d8d5; border-radius: 6px;
  }
  .mer-header .mer-title {
    display: flex; align-items: center; gap: 6px; flex: 1;
    color: #222; font-size: 14px; font-weight: 600;
  }
  .mer-header .mer-title .arrow {
    font-size: 11px; color: #777; transition: transform .15s ease;
  }
  .mer-header.collapsed .arrow { transform: rotate(-90deg); }
  .mer-header .mer-count { color: #777; font-size: 11px; font-weight: 400; }
  .mer-header .mer-all { color: #555; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .mer-list { display: flex; flex-direction: column; gap: 10px; }
  .mer-list.collapsed { display: none; }

  .pt-card {
    background: #f2f2f0; border-radius: 10px; padding: 10px 10px 12px;
  }
  .pt-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .pt-header .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .pt-header b { color: #222; font-size: 14px; }
  .pt-header .pt-code { color: #888; font-size: 11px; }
  .pt-attr { display: flex; gap: 8px; padding: 3px 0 3px 25px; font-size: 12px; line-height: 1.6; }
  .pt-attr .attr-label {
    flex: 0 0 66px; color: #3d7ab0; font-weight: 600;
  }
  .pt-attr .attr-val { flex: 1; color: #444; }
  .pt-attr .note-input {
    flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 5px;
    color: #222; font-size: 12px; padding: 4px 6px; width: 100%; box-sizing: border-box;
  }
  input[type="checkbox"] { width: 17px; height: 17px; flex-shrink: 0; }

  #versionFooter {
    text-align: center; color: #888; font-size: 11px; padding: 24px 0 4px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="titleBar"><h1>顏面部穴位AR學習</h1></div>

  <div id="arControlBar">
    <button id="arToggleBtn" class="ar-toggle on">AR：開啟</button>
  </div>

  <div id="arWrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="labelLayer"></div>
    <div id="topbar">
      <button id="descBtn">顯示說明</button>
      <button id="nerveBtn">神經解剖</button>
      <button id="switchBtn">切換鏡頭</button>
    </div>
    <div id="status">正在載入辨識模型…</div>
  </div>

  <div id="panel">
    <div id="noteToolbar">
      <button id="saveNotesBtn" class="save">儲存我的備註</button>
      <button id="loadNotesBtn">載入我的備註</button>
      <input type="file" id="loadNotesFile" accept="application/json" style="display:none">
    </div>
    <div id="panelNote">
      勾選要顯示的穴位，上方畫面即時疊加。點各經絡標題可收合／展開清單。同名左右對稱穴位同時顯示時，畫面左側僅顯示圓點、不重複顯示文字說明，避免畫面雜亂。臉部辨識網格未涵蓋髮際線，故部分需以髮際線定位的穴位未收錄。以下解剖與操作說明僅供學習參考，實際臨床操作請依專業判斷。
    </div>
    <div id="panelList"></div>
    <div id="versionFooter">v1.3 · 2026年8月更新</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.5/dist/face-landmarks-detection.min.js"></script>

<script>
/* ------------------------------------------------------------------
   顏面部穴位AR學習 v1.3
   原理：MediaPipe FaceMesh 468 關鍵點 → 以穩定解剖錨點（眉/眼/鼻/口/
        臉頰輪廓/顳部）為基準，用比例換算法推算各穴位相對座標 →
        依勾選狀態即時疊加繪製，並依臉部轉向隱藏遮住那側的點
   僅供衛教／教學參考，非臨床定位或操作依據
------------------------------------------------------------------- */

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const labelLayer = document.getElementById('labelLayer');
const statusEl = document.getElementById('status');
const descBtn = document.getElementById('descBtn');
const nerveBtn = document.getElementById('nerveBtn');
const switchBtn = document.getElementById('switchBtn');
const arToggleBtn = document.getElementById('arToggleBtn');
const arWrap = document.getElementById('arWrap');
const panelList = document.getElementById('panelList');
const saveNotesBtn = document.getElementById('saveNotesBtn');
const loadNotesBtn = document.getElementById('loadNotesBtn');
const loadNotesFile = document.getElementById('loadNotesFile');

let detector = null;
let currentFacing = 'user';
let showDesc = false;
let showNerve = false;
let arEnabled = false;
let loopRunning = false;

const IDX = {
  browOuterR: 70,  browMidR: 105, browInnerR: 107,
  browOuterL: 300, browMidL: 334, browInnerL: 336,
  eyeOuterR: 33,   eyeInnerR: 133, eyeTopR: 159, eyeBottomR: 145,
  eyeOuterL: 263,  eyeInnerL: 362, eyeTopL: 386, eyeBottomL: 374,
  noseTip: 4, noseBase: 2, noseAlaR: 129, noseAlaL: 358,
  glabella: 168, foreheadTop: 10, chin: 152,
  cheekR: 234, cheekL: 454,
  jawR: 172, jawL: 397,
  templeR: 127, templeL: 356,
  mouthCornerR: 61, mouthCornerL: 291,
  upperLipTop: 0, lowerLipBottom: 17,
  foreheadCornerR: 21, foreheadCornerL: 251
};

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
function off(p, dx, dy) { return { x: p.x + dx, y: p.y + dy }; }

const MERIDIANS = {
  EX:  { name: '經外奇穴', color: '#95a5a6' },
  LI:  { name: '大腸經',   color: '#f5a623' },
  ST:  { name: '胃經',     color: '#e74c3c' },
  SI:  { name: '小腸經',   color: '#9b59b6' },
  BL:  { name: '膀胱經',   color: '#3498db' },
  SJ:  { name: '三焦經',   color: '#1abc9c' },
  GB:  { name: '膽經',     color: '#2ecc71' },
  DU:  { name: '督脈',     color: '#f1c40f' },
  REN: { name: '任脈',     color: '#e91e63' }
};
const MERIDIAN_ORDER = ['EX','LI','ST','SI','BL','SJ','GB','DU','REN'];

const ACUPOINTS = [
  { id:'ex_yintang', name:'印堂', code:'EX-HN3', meridian:'EX', side:'M',
    desc:'兩眉頭連線中點',
    indications:'頭痛、鼻塞、失眠、眩暈、小兒驚風',
    anatomy:'皮下為額肌、降眉間肌，布有滑車上神經',
    technique:'提捏進針，向下平刺0.3–0.5寸，或三稜針點刺出血',
    calc:(kp)=> mid(kp[IDX.browInnerR], kp[IDX.browInnerL], 0.5) },
  { id:'ex_qiuhou', name:'球後', code:'EX-HN7', meridian:'EX', side:'LR',
    desc:'眶下緣，瞳孔直下與外眥垂線之間凹陷處',
    indications:'目赤腫痛、視力減退、眼肌麻痺、近視',
    anatomy:'眶下緣深部為眼球下方組織，布有眶下神經分支',
    technique:'沿眶下緣緩慢直刺0.5–1寸，不宜提插捻轉，出針後按壓片刻',
    calc:(kp,s,sc)=>{
      const b = s==='R'?kp[IDX.eyeBottomR]:kp[IDX.eyeBottomL];
      const o = s==='R'?kp[IDX.eyeOuterR]:kp[IDX.eyeOuterL];
      return off(mid(b,o,0.4), 0, sc*0.05);
    }},
  { id:'ex_yuyao', name:'魚腰', code:'EX-HN4', meridian:'EX', side:'LR',
    desc:'眉毛中點，瞳孔直上',
    indications:'眼瞼下垂、眼瞼瞤動、目赤腫痛、眉稜骨痛',
    anatomy:'皮下為眼輪匝肌，布有眶上神經分支',
    technique:'平刺0.3–0.5寸',
    calc:(kp,s)=> s==='R' ? kp[IDX.browMidR] : kp[IDX.browMidL] },
  { id:'ex_taiyang', name:'太陽穴', code:'EX-HN5', meridian:'EX', side:'LR',
    desc:'眉梢與外眼角連線中點，向後約一橫指凹陷處',
    indications:'偏頭痛、目赤腫痛、口眼歪斜',
    anatomy:'皮下為顳肌，布有顳淺動靜脈及耳顳神經',
    technique:'直刺或斜刺0.3–0.5寸，或三稜針點刺出血',
    calc:(kp,s,sc)=>{
      const brow = s==='R'?kp[IDX.browOuterR]:kp[IDX.browOuterL];
      const eye  = s==='R'?kp[IDX.eyeOuterR]:kp[IDX.eyeOuterL];
      const dir  = s==='R'?-1:1;
      const m = mid(brow, eye, 0.5);
      return { x: m.x + dir*sc*0.18, y: m.y - sc*0.02 };
    }},

  { id:'li_yingxiang', name:'迎香', code:'LI20', meridian:'LI', side:'LR',
    desc:'鼻翼外緣中點，鼻唇溝凹陷處',
    indications:'鼻塞、鼻淵、口眼歪斜、面癢',
    anatomy:'皮下為提上唇肌，布有眶下神經及面神經頰支',
    technique:'斜刺或平刺0.3–0.5寸',
    calc:(kp,s)=>{
      const ala = s==='R'?kp[IDX.noseAlaR]:kp[IDX.noseAlaL];
      return { x: ala.x, y: kp[IDX.noseBase].y };
    }},
  { id:'li_hejiao', name:'口禾髎', code:'LI19', meridian:'LI', side:'LR',
    desc:'鼻孔外緣直下，水溝穴旁約0.5寸',
    indications:'鼻塞、鼻衄、口歪、口噤',
    anatomy:'皮下為口輪匝肌，布有眶下神經分支及面神經頰支',
    technique:'斜刺0.3–0.5寸',
    calc:(kp,s)=>{
      const ala = s==='R'?kp[IDX.noseAlaR]:kp[IDX.noseAlaL];
      const yx = { x: ala.x, y: kp[IDX.noseBase].y };
      const m = s==='R'?kp[IDX.mouthCornerR]:kp[IDX.mouthCornerL];
      return mid(yx, m, 0.3);
    }},

  { id:'st_chengqi', name:'承泣', code:'ST1', meridian:'ST', side:'LR',
    desc:'瞳孔直下，眼球與眶下緣之間',
    indications:'目赤腫痛、迎風流淚、夜盲、眼瞼瞤動',
    anatomy:'位於眼輪匝肌與眶下緣之間，深部為眼球，布有眶下神經',
    technique:'囑患者閉目，固定眼球，沿眶下緣緩慢直刺0.5–1寸，不宜提插捻轉',
    calc:(kp,s)=>{
      const b = s==='R'?kp[IDX.eyeBottomR]:kp[IDX.eyeBottomL];
      const t = s==='R'?kp[IDX.eyeTopR]:kp[IDX.eyeTopL];
      return off(b, 0, dist(t,b)*0.25);
    }},
  { id:'st_sibai', name:'四白', code:'ST2', meridian:'ST', side:'LR',
    desc:'瞳孔直下，眶下孔凹陷處',
    indications:'目赤癢痛、眼瞼瞤動、口眼歪斜、頭面疼痛',
    anatomy:'為眶下孔所在，布有眶下神經、眶下動靜脈',
    technique:'直刺0.2–0.3寸，或沿皮刺，不可深刺以免傷及眶下孔',
    calc:(kp,s)=>{
      const top = s==='R'?kp[IDX.eyeTopR]:kp[IDX.eyeTopL];
      const bot = s==='R'?kp[IDX.eyeBottomR]:kp[IDX.eyeBottomL];
      const eyeH = dist(top,bot);
      return { x: bot.x, y: bot.y + eyeH*1.0 };
    }},
  { id:'st_juliao', name:'巨髎', code:'ST3', meridian:'ST', side:'LR',
    desc:'瞳孔直下，平鼻翼下緣',
    indications:'口眼歪斜、鼻衄、齒痛、唇頰腫',
    anatomy:'皮下為提上唇肌，布有眶下神經、面神經分支',
    technique:'直刺或斜刺0.3–0.5寸',
    calc:(kp,s)=>{
      const b = s==='R'?kp[IDX.eyeBottomR]:kp[IDX.eyeBottomL];
      return { x:b.x, y: kp[IDX.noseBase].y };
    }},
  { id:'st_ditsang', name:'地倉', code:'ST4', meridian:'ST', side:'LR',
    desc:'口角外側，瞳孔直下',
    indications:'口眼歪斜、流涎、三叉神經痛',
    anatomy:'皮下為口輪匝肌，深層為頰肌，布有面神經及眶下神經分支',
    technique:'斜刺或平刺0.5–0.8寸，可透刺頰車',
    calc:(kp,s,sc)=>{
      const m = s==='R'?kp[IDX.mouthCornerR]:kp[IDX.mouthCornerL];
      const dir = s==='R'?-1:1;
      return off(m, dir*sc*0.03, 0);
    }},
  { id:'st_daying', name:'大迎', code:'ST5', meridian:'ST', side:'LR',
    desc:'下頜角前方，咬肌附著部前緣，動脈搏動處',
    indications:'口眼歪斜、頰腫、齒痛、面癱',
    anatomy:'布有面動靜脈、面神經下頜緣支',
    technique:'避開動脈，斜刺或平刺0.3–0.5寸',
    calc:(kp,s)=> s==='R' ? mid(kp[IDX.mouthCornerR], kp[IDX.jawR], 0.6)
                          : mid(kp[IDX.mouthCornerL], kp[IDX.jawL], 0.6) },
  { id:'st_jiache', name:'頰車', code:'ST6', meridian:'ST', side:'LR',
    desc:'下頜角前上方一橫指，咀嚼時咬肌隆起處',
    indications:'口眼歪斜、齒痛、頰腫、牙關緊閉',
    anatomy:'皮下為咬肌，布有耳大神經及面神經下頜緣支',
    technique:'直刺0.3–0.5寸，或平刺透地倉',
    calc:(kp,s,sc)=>{
      const j = s==='R'?kp[IDX.jawR]:kp[IDX.jawL];
      return off(j, 0, -sc*0.05);
    }},
  { id:'st_xiaguan', name:'下關', code:'ST7', meridian:'ST', side:'LR',
    desc:'顴弓下緣，下頜骨髁狀突前方凹陷處',
    indications:'耳聾耳鳴、齒痛、口眼歪斜、顳頜關節炎',
    anatomy:'皮下為腮腺，深層為翼外肌，布有耳顳神經及面神經',
    technique:'直刺0.3–0.5寸，張口取穴，閉口進針',
    calc:(kp,s)=> s==='R' ? mid(kp[IDX.templeR], kp[IDX.jawR], 0.35)
                          : mid(kp[IDX.templeL], kp[IDX.jawL], 0.35) },

  { id:'si_quanliao', name:'顴髎', code:'SI18', meridian:'SI', side:'LR',
    desc:'目外眥直下，顴骨下緣凹陷處',
    indications:'口眼歪斜、眼瞼瞤動、齒痛、面痛',
    anatomy:'皮下為咬肌起始部，布有面神經及眶下神經分支',
    technique:'直刺0.3–0.5寸，或斜刺',
    calc:(kp,s,sc)=>{
      const e = s==='R'?kp[IDX.eyeOuterR]:kp[IDX.eyeOuterL];
      return off(e, 0, sc*0.30);
    }},

  { id:'bl_jingming', name:'睛明', code:'BL1', meridian:'BL', side:'LR',
    desc:'目內眥角上方0.1寸凹陷處',
    indications:'目赤腫痛、迎風流淚、視物不明、近視',
    anatomy:'位於眼眶內側緣，深部為眼球內側，布有滑車上下神經',
    technique:'輕推眼球固定，沿眶內側壁緩慢直刺0.3–0.5寸，不宜提插捻轉',
    calc:(kp,s)=>{
      const p = s==='R'?kp[IDX.eyeInnerR]:kp[IDX.eyeInnerL];
      const w = s==='R'?dist(kp[IDX.eyeOuterR],kp[IDX.eyeInnerR]):dist(kp[IDX.eyeOuterL],kp[IDX.eyeInnerL]);
      return { x:p.x, y:p.y - w*0.15 };
    }},
  { id:'bl_zanzhu', name:'攢竹', code:'BL2', meridian:'BL', side:'LR',
    desc:'眉頭內側凹陷處，眶上切跡處',
    indications:'頭痛、眉稜骨痛、眼瞼瞤動、目視不明',
    anatomy:'皮下為額肌，布有眶上神經、眶上動靜脈',
    technique:'平刺0.3–0.5寸，或向下透睛明（輕刺）',
    calc:(kp,s)=> s==='R' ? mid(kp[IDX.browInnerR], kp[IDX.eyeInnerR], 0.15)
                          : mid(kp[IDX.browInnerL], kp[IDX.eyeInnerL], 0.15) },

  { id:'sj_sizhukong', name:'絲竹空', code:'SJ23', meridian:'SJ', side:'LR',
    desc:'眉梢外端凹陷處',
    indications:'頭痛、目眩、眼瞼瞤動、齒痛',
    anatomy:'皮下為眼輪匝肌，布有顴顳神經分支',
    technique:'平刺0.3–0.5寸',
    calc:(kp,s)=> s==='R' ? kp[IDX.browOuterR] : kp[IDX.browOuterL] },

  { id:'gb_tongziliao', name:'瞳子髎', code:'GB1', meridian:'GB', side:'LR',
    desc:'目外眥外側0.5寸凹陷處',
    indications:'頭痛、目赤腫痛、目翳、口眼歪斜',
    anatomy:'皮下為眼輪匝肌，布有顴面神經、顴顳神經',
    technique:'平刺0.3–0.5寸，或三稜針點刺出血',
    calc:(kp,s,sc)=>{
      const e = s==='R'?kp[IDX.eyeOuterR]:kp[IDX.eyeOuterL];
      const dir = s==='R'?-1:1;
      return off(e, dir*sc*0.05, 0);
    }},
  { id:'gb_shangguan', name:'上關', code:'GB3', meridian:'GB', side:'LR',
    desc:'顴弓上緣，下關穴直上凹陷處',
    indications:'耳聾耳鳴、齒痛、口眼歪斜、偏頭痛',
    anatomy:'皮下為顳肌，布有耳顳神經、面神經顴支',
    technique:'直刺0.3–0.5寸，張口取穴',
    calc:(kp,s,sc)=>{
      const m = s==='R'?mid(kp[IDX.templeR],kp[IDX.jawR],0.3):mid(kp[IDX.templeL],kp[IDX.jawL],0.3);
      return off(m, 0, -sc*0.1);
    }},
  { id:'gb_yangbai', name:'陽白', code:'GB14', meridian:'GB', side:'LR',
    desc:'眉毛中點直上1寸',
    indications:'頭痛、眉稜骨痛、眼瞼瞤動、目眩',
    anatomy:'皮下為額肌，布有眶上神經外側支',
    technique:'平刺0.3–0.5寸',
    calc:(kp,s,sc)=>{
      const b = s==='R'?kp[IDX.browMidR]:kp[IDX.browMidL];
      return off(b, 0, -sc*0.22);
    }},

  { id:'du_suliao', name:'素髎', code:'DU25', meridian:'DU', side:'M',
    desc:'鼻尖正中央',
    indications:'鼻塞、鼻衄、昏迷、休克急救',
    anatomy:'皮下為鼻軟骨，布有篩前神經鼻外支',
    technique:'向上斜刺0.3寸，或點刺出血，不灸',
    calc:(kp)=> kp[IDX.noseTip] },
  { id:'du_shuigou', name:'水溝', code:'DU26', meridian:'DU', side:'M',
    desc:'人中溝上1/3與下2/3交界處',
    indications:'昏迷、暈厥、癲癇、急性腰扭傷，常用於急救要穴',
    anatomy:'皮下為口輪匝肌，布有眶下神經分支',
    technique:'向上斜刺0.3–0.5寸，強刺激；急救時可用指甲掐按代替針刺',
    calc:(kp)=> mid(kp[IDX.noseBase], kp[IDX.upperLipTop], 0.4) },
  { id:'du_duiduan', name:'兌端', code:'DU27', meridian:'DU', side:'M',
    desc:'上唇尖端，唇珠上緣',
    indications:'口歪、齒齦腫痛、癲狂',
    anatomy:'皮下為口輪匝肌，布有眶下神經分支',
    technique:'斜刺0.2–0.3寸',
    calc:(kp,_,sc)=> off(kp[IDX.upperLipTop], 0, sc*0.02) },
  { id:'du_yinjiao', name:'齦交', code:'DU28', meridian:'DU', side:'M',
    desc:'上唇繫帶與齒齦交接處（口腔內，體表僅概略標示）',
    indications:'齒齦腫痛、口臭、鼻淵',
    anatomy:'上唇繫帶處，布有上頜神經分支',
    technique:'向上斜刺0.2寸，或點刺出血',
    calc:(kp,_,sc)=> off(kp[IDX.upperLipTop], 0, sc*0.08) },

  { id:'ren_chengjiang', name:'承漿', code:'REN24', meridian:'REN', side:'M',
    desc:'下唇下方，頦唇溝凹陷正中',
    indications:'口眼歪斜、齒齦腫痛、流涎、癲癇',
    anatomy:'皮下為下唇方肌，布有頦神經分支',
    technique:'斜刺0.3–0.5寸',
    calc:(kp,_,sc)=> off(kp[IDX.lowerLipBottom], 0, sc*0.15) },
  { id:'ren_lianquan', name:'廉泉', code:'REN23', meridian:'REN', side:'M',
    desc:'喉結上方，舌骨上緣凹陷處',
    indications:'舌強不語、吞嚥困難、失音、流涎',
    anatomy:'深部為會厭，布有舌下神經分支',
    technique:'針尖向舌根方向斜刺0.5–0.8寸，不宜深刺',
    calc:(kp,_,sc)=> off(kp[IDX.chin], 0, sc*0.55) }
];

/* ------------------------------------------------------------------
   神經解剖示意（三叉神經三孔＋顏面神經五分支）
   同樣以 FaceMesh 關鍵點比例外推估算，僅供教學示意，非個人化精確定位
------------------------------------------------------------------- */
const TRIGEMINAL_POINTS = [
  { id:'v1', label:'V1 眶上孔', desc:'眶上緣，額神經（眼神經分支）出顱處，與四白、頦孔約略同一垂直線',
    calc:(kp,s)=>{
      const brow = s==='R'?kp[IDX.browMidR]:kp[IDX.browMidL];
      const eyeTop = s==='R'?kp[IDX.eyeTopR]:kp[IDX.eyeTopL];
      return mid(brow, eyeTop, 0.3);
    }},
  { id:'v2', label:'V2 眶下孔', desc:'眶下緣下方，上頷神經分支出顱處（與四白穴位置重疊）',
    calc:(kp,s)=>{
      const top = s==='R'?kp[IDX.eyeTopR]:kp[IDX.eyeTopL];
      const bot = s==='R'?kp[IDX.eyeBottomR]:kp[IDX.eyeBottomL];
      const eyeH = dist(top,bot);
      return { x: bot.x, y: bot.y + eyeH*1.0 };
    }},
  { id:'v3', label:'V3 頦孔', desc:'下頷骨體，下齒槽神經（下頷神經分支）出顱處，約在第二小臼齒下方',
    calc:(kp,s)=>{
      const mc = s==='R'?kp[IDX.mouthCornerR]:kp[IDX.mouthCornerL];
      const ch = kp[IDX.chin];
      return mid(mc, ch, 0.45);
    }}
];

const FACIAL_NERVE_BRANCHES = [
  { id:'temporal', label:'顳支',
    target:(kp,s)=> off(s==='R'?kp[IDX.browOuterR]:kp[IDX.browOuterL], 0, -1) },
  { id:'zygomatic', label:'顴支',
    target:(kp,s)=> s==='R'?kp[IDX.eyeOuterR]:kp[IDX.eyeOuterL] },
  { id:'buccal', label:'頰支',
    target:(kp,s)=> mid(s==='R'?kp[IDX.noseAlaR]:kp[IDX.noseAlaL], s==='R'?kp[IDX.mouthCornerR]:kp[IDX.mouthCornerL], 0.5) },
  { id:'mandibular', label:'下頷緣支',
    target:(kp,s)=> mid(s==='R'?kp[IDX.jawR]:kp[IDX.jawL], kp[IDX.chin], 0.5) },
  { id:'cervical', label:'頸支',
    target:(kp,s,sc)=> off(s==='R'?kp[IDX.jawR]:kp[IDX.jawL], 0, sc*0.22) }
];
function facialNerveOrigin(kp, s) {
  const jaw = s==='R'?kp[IDX.jawR]:kp[IDX.jawL];
  const temple = s==='R'?kp[IDX.templeR]:kp[IDX.templeL];
  return mid(jaw, temple, 0.3);
}

function computeNerveOverlay(kp) {
  const scale = dist(kp[IDX.eyeOuterR], kp[IDX.eyeOuterL]) || 1;
  const visible = getVisibleSides(kp);
  const points = [];
  const lines = [];
  ['R','L'].forEach(s => {
    if (!visible[s]) return;
    TRIGEMINAL_POINTS.forEach(tp => {
      points.push({ label: tp.label, desc: tp.desc, pos: tp.calc(kp, s, scale) });
    });
    const origin = facialNerveOrigin(kp, s);
    FACIAL_NERVE_BRANCHES.forEach(fb => {
      lines.push({ label: fb.label, from: origin, to: fb.target(kp, s, scale) });
    });
  });
  return { points, lines };
}

const selected = new Set(['ex_yuyao','ex_taiyang','sj_sizhukong','bl_zanzhu','bl_jingming','st_sibai']);

const NOTES_KEY = 'acupoint_notes_v1';
let notes = {};
try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch(e) { notes = {}; }
function saveNotesToStorage() {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch(e) {}
}

function buildPanel() {
  MERIDIAN_ORDER.forEach(mkey => {
    const info = MERIDIANS[mkey];
    const items = ACUPOINTS.filter(a => a.meridian === mkey);
    if (!items.length) return;

    const section = document.createElement('div');
    section.className = 'mer-section';

    const header = document.createElement('div');
    header.className = 'mer-header collapsed';
    header.style.borderLeftColor = info.color;
    header.innerHTML =
      '<div class="mer-title"><span class="arrow">▾</span>' + info.name +
      ' <span class="mer-count">(' + items.length + ')</span></div>' +
      '<label class="mer-all"><input type="checkbox" class="mer-all-cb" data-mer="' + mkey + '"> 全選</label>';
    section.appendChild(header);

    const list = document.createElement('div');
    list.className = 'mer-list collapsed';
    items.forEach(pt => {
      const card = document.createElement('div');
      card.className = 'pt-card';
      card.innerHTML =
        '<div class="pt-header">' +
          '<input type="checkbox" class="pt-cb" data-id="' + pt.id + '"' + (selected.has(pt.id) ? ' checked' : '') + '>' +
          '<span class="dot" style="background:' + info.color + '"></span>' +
          '<b>' + pt.name + '</b><span class="pt-code">' + pt.code + '</span>' +
        '</div>' +
        '<div class="pt-attr"><span class="attr-label">取穴</span><span class="attr-val">' + pt.desc + '</span></div>' +
        '<div class="pt-attr"><span class="attr-label">主治功效</span><span class="attr-val">' + pt.indications + '</span></div>' +
        '<div class="pt-attr"><span class="attr-label">解剖結構</span><span class="attr-val">' + pt.anatomy + '</span></div>' +
        '<div class="pt-attr"><span class="attr-label">針灸操作</span><span class="attr-val">' + pt.technique + '</span></div>' +
        '<div class="pt-attr"><span class="attr-label">我的備註</span><input class="note-input" data-note-id="' + pt.id + '" placeholder="輸入我的備註…" value="' + (notes[pt.id] ? notes[pt.id].replace(/"/g,'&quot;') : '') + '"></div>';
      list.appendChild(card);
    });
    section.appendChild(list);
    panelList.appendChild(section);

    header.querySelector('.mer-title').addEventListener('click', () => {
      header.classList.toggle('collapsed');
      list.classList.toggle('collapsed');
    });
  });

  panelList.querySelectorAll('.pt-cb').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      if (e.target.checked) selected.add(id); else selected.delete(id);
    });
  });
  panelList.querySelectorAll('.mer-all-cb').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => {
      const mkey = e.target.dataset.mer;
      const checked = e.target.checked;
      ACUPOINTS.filter(a => a.meridian === mkey).forEach(a => {
        if (checked) selected.add(a.id); else selected.delete(a.id);
      });
      panelList.querySelectorAll('.pt-cb').forEach(ccb => {
        const pt = ACUPOINTS.find(a => a.id === ccb.dataset.id);
        if (pt.meridian === mkey) ccb.checked = checked;
      });
    });
  });
  panelList.querySelectorAll('.note-input').forEach(inp => {
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('input', e => {
      const id = e.target.dataset.noteId;
      notes[id] = e.target.value;
      saveNotesToStorage();
    });
  });
}

function timestampStr() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
}

saveNotesBtn.addEventListener('click', () => {
  const data = JSON.stringify(notes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '穴位我的備註_' + timestampStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

loadNotesBtn.addEventListener('click', () => loadNotesFile.click());
loadNotesFile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const loaded = JSON.parse(evt.target.result);
      notes = Object.assign({}, notes, loaded);
      saveNotesToStorage();
      panelList.querySelectorAll('.note-input').forEach(inp => {
        const id = inp.dataset.noteId;
        if (notes[id] !== undefined) inp.value = notes[id];
      });
      alert('備註已載入');
    } catch (err) {
      alert('載入失敗，檔案格式不正確');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function getVisibleSides(kp) {
  const cheekR = kp[IDX.cheekR], cheekL = kp[IDX.cheekL];
  const faceScale = dist(kp[IDX.eyeOuterR], kp[IDX.eyeOuterL]) || 1;
  const zDiff = (cheekR.z ?? 0) - (cheekL.z ?? 0);
  const threshold = faceScale * 0.35;
  if (zDiff > threshold) return { R: false, L: true };
  if (zDiff < -threshold) return { R: true, L: false };
  return { R: true, L: true };
}

function computePoints(kp) {
  const scale = dist(kp[IDX.eyeOuterR], kp[IDX.eyeOuterL]) || 1;
  const visible = getVisibleSides(kp);
  const pts = [];
  ACUPOINTS.forEach(ap => {
    if (!selected.has(ap.id)) return;
    const color = MERIDIANS[ap.meridian].color;
    if (ap.side === 'M') {
      pts.push({ name: ap.name, desc: ap.desc, color, pos: ap.calc(kp, null, scale) });
    } else {
      if (visible.R) pts.push({ name: ap.name, desc: ap.desc, color, pos: ap.calc(kp, 'R', scale) });
      if (visible.L) pts.push({ name: ap.name, desc: ap.desc, color, pos: ap.calc(kp, 'L', scale) });
    }
  });
  return pts;
}

async function setupCamera(facing) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 720 }, height: { ideal: 960 } },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(resolve => { video.onloadedmetadata = () => resolve(video); });
}

async function loadModel() {
  if (detector) return;
  const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
  detector = await faceLandmarksDetection.createDetector(model, {
    runtime: 'mediapipe',
    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619',
    refineLandmarks: false,
    maxFaces: 1
  });
}

function resizeCanvas() {
  overlay.width = overlay.clientWidth;
  overlay.height = overlay.clientHeight;
}

function getCoverMapping() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const cw = overlay.width, ch = overlay.height;
  const scale = Math.max(cw / vw, ch / vh);
  const renderedW = vw * scale, renderedH = vh * scale;
  return { scale, offsetX: (cw - renderedW) / 2, offsetY: (ch - renderedH) / 2 };
}

function drawPoints(points) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  labelLayer.innerHTML = '';
  const { scale, offsetX, offsetY } = getCoverMapping();

  const resolved = points.map(p => {
    const rawX = p.pos.x * scale + offsetX;
    const rawY = p.pos.y * scale + offsetY;
    return { name: p.name, desc: p.desc, color: p.color, x: overlay.width - rawX, y: rawY };
  });

  const byName = {};
  resolved.forEach(p => { (byName[p.name] = byName[p.name] || []).push(p); });
  const suppressed = new Set();
  Object.values(byName).forEach(group => {
    if (group.length === 2) {
      const leftOne = group[0].x < group[1].x ? group[0] : group[1];
      suppressed.add(leftOne);
    }
  });

  resolved.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    if (suppressed.has(p)) return;

    const lbl = document.createElement('div');
    lbl.className = 'dot-label';
    lbl.style.left = p.x + 'px';
    lbl.style.top = p.y + 'px';
    lbl.innerHTML = '<span class="lbl-name">' + p.name + '</span>' +
      (showDesc ? '<span class="lbl-desc">' + p.desc + '</span>' : '');
    labelLayer.appendChild(lbl);
  });
}

function toCanvasPoint(pos, mapping) {
  const rawX = pos.x * mapping.scale + mapping.offsetX;
  const rawY = pos.y * mapping.scale + mapping.offsetY;
  return { x: overlay.width - rawX, y: rawY };
}

function drawNerves(overlayData) {
  const mapping = getCoverMapping();

  ctx.save();
  ctx.strokeStyle = '#ffe082';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 4]);
  overlayData.lines.forEach(ln => {
    const a = toCanvasPoint(ln.from, mapping);
    const b = toCanvasPoint(ln.to, mapping);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();

  overlayData.points.forEach(p => {
    const c = toCanvasPoint(p.pos, mapping);
    ctx.beginPath();
    ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#4fc3f7';
    ctx.stroke();

    if (showDesc) {
      const lbl = document.createElement('div');
      lbl.className = 'dot-label';
      lbl.style.left = c.x + 'px';
      lbl.style.top = c.y + 'px';
      lbl.innerHTML = '<span class="lbl-name">' + p.label + '</span>';
      labelLayer.appendChild(lbl);
    }
  });
}

async function detectLoop() {
  if (!arEnabled) { loopRunning = false; return; }
  loopRunning = true;
  if (detector && video.readyState >= 2) {
    const faces = await detector.estimateFaces(video);
    if (faces.length > 0) {
      const kp = faces[0].keypoints;
      drawPoints(computePoints(kp));
      if (showNerve) drawNerves(computeNerveOverlay(kp));
      statusEl.style.display = 'none';
    } else {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      labelLayer.innerHTML = '';
      statusEl.style.display = 'block';
      statusEl.textContent = '請將臉部正對鏡頭';
    }
  }
  requestAnimationFrame(detectLoop);
}

descBtn.addEventListener('click', () => {
  showDesc = !showDesc;
  descBtn.textContent = showDesc ? '隱藏說明' : '顯示說明';
  descBtn.classList.toggle('active', showDesc);
});

nerveBtn.addEventListener('click', () => {
  showNerve = !showNerve;
  nerveBtn.textContent = showNerve ? '隱藏神經' : '神經解剖';
  nerveBtn.classList.toggle('active', showNerve);
  if (!showNerve) labelLayer.innerHTML = '';
});

switchBtn.addEventListener('click', async () => {
  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
  await setupCamera(currentFacing);
  resizeCanvas();
});

async function turnArOn() {
  arWrap.classList.remove('collapsed');
  statusEl.style.display = 'block';
  statusEl.textContent = '正在啟動相機…';
  try {
    await setupCamera(currentFacing);
    resizeCanvas();
    statusEl.textContent = '正在載入辨識模型…';
    await loadModel();
    statusEl.textContent = '請將臉部正對鏡頭';
    arEnabled = true;
    arToggleBtn.textContent = 'AR：開啟';
    arToggleBtn.classList.remove('off');
    arToggleBtn.classList.add('on');
    if (!loopRunning) detectLoop();
  } catch (err) {
    statusEl.textContent = '啟動失敗：' + err.message + '（請確認已允許相機權限，且網頁為 HTTPS）';
  }
}

function turnArOff() {
  arEnabled = false;
  arToggleBtn.textContent = 'AR：關閉';
  arToggleBtn.classList.remove('on');
  arToggleBtn.classList.add('off');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  arWrap.classList.add('collapsed');
}

arToggleBtn.addEventListener('click', () => {
  if (arEnabled) turnArOff(); else turnArOn();
});

window.addEventListener('resize', resizeCanvas);

(function init() {
  buildPanel();
  turnArOn();
})();
</script>
